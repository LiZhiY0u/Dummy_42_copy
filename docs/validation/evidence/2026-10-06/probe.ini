LOAD %L NOCODE
FUNC void DumpStack(void) {
  unsigned long a;
  for (a=0x20001DC8; a<0x200021C8; a+=4) {
    printf("STACK %08X %08X\n", a, _RDWORD(a));
  }
}
FUNC void FillStack(void) {
  unsigned long a;
  if (MSP<=0x200021C8 && MSP>=0x200020C8 && R13==MSP && R15==0x0800A7A8 && CONTROL==0) {
    for (a=0x20001DC8; a<MSP; a+=4) _WDWORD(a,0xA5A5A5A5);
    printf("FILL_OK_MAIN_FREE_STACK SP=%08X\n",MSP);
  } else {
    printf("FILL_REFUSED\n");
  }
}
G,main
printf ("PROBE SP=%08X PC=%08X MSP=%08X PSP=%08X CONTROL=%08X\n", R13, R15, MSP, PSP, CONTROL)
printf("BEFORE\n")
DumpStack()
FillStack()
printf("FILLED\n")
